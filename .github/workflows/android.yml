name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: LTW renderer
        run: |
          echo "libltw.so is built from source via ndk-build (jni/ltw/Android.mk, ltw-lite Create fixes)."

      - name: Get JRE (extract bundled binpacks from official PojavLauncher release APK)
        run: |
          apt-get update && apt-get install -y wget unzip
          wget -q "https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk" -O /tmp/pojav.apk
          mkdir -p /tmp/pojavassets
          unzip -o -q /tmp/pojav.apk "assets/components/jre" "assets/components/jre-new" "assets/components/jre-21" -d /tmp/pojavassets
          mkdir -p app_pojavlauncher/src/main/assets/components
          cp -r /tmp/pojavassets/assets/components/. app_pojavlauncher/src/main/assets/components/
          echo "JRE assets:"; ls -la app_pojavlauncher/src/main/assets/components/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Google Play .aab
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleGplay
          mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltw-launcher-${{ github.run_number }}
          name: ltw-lite Launcher (libltw.so + Create fixes) - run ${{ github.run_number }}
          body: |
            PojavLauncher build with the ltw-lite renderer (libltw.so) built from source
            (jni/ltw, our GLSL->GLSL ES 3.00 translation, stencil FBO merge,
            texture/format/wrap adaptation, QUADS/POLYGON expansion).
            Default renderer: opengles3_ltw.
            The JRE (8/17/21) is bundled from the official PojavLauncher release, so the
            launcher runs without downloading a runtime. This build uses the PRE-crash-fix
            renderer; a corrected build follows once crash logs are available.
          files: |
            out/app-debug.apk
            out/app-debug-noruntime.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

